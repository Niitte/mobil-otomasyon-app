name: Autonomous Mobile Dev Pipeline

on:
  workflow_dispatch:
    inputs:
      app_idea:
        description: 'Geliştirilecek Uygulama Fikri'
        required: true
        default: 'Alışkanlık Takip ve İstatistik Uygulaması'
  pull_request:
    types: [opened]

jobs:
  research_and_trigger:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Bağımlılıkları Yükle
        run: pip install requests
        
      - name: Dosya Kontrolü
        run: ls -la scripts/
        
      - name: Gemini Araştırma ve Jules Tetikleme
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IDEA: ${{ inputs.app_idea }}
        run: python scripts/research_and_spec.py
